name: Recover Linux desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop prerelease tag to rebuild from
        required: true
        default: desktop-v0.1.0-beta.24

permissions:
  contents: write

concurrency:
  group: desktop-linux-recovery-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out immutable desktop tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: jcode-desktop
      - name: Verify desktop source and existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" == desktop-v* ]]
          tag_commit=$(git -C jcode-desktop rev-parse "$TAG^{}")
          checkout_commit=$(git -C jcode-desktop rev-parse HEAD)
          [[ "$checkout_commit" == "$tag_commit" ]]
          if [[ "$TAG" == desktop-v0.1.0-beta.24 ]]; then
            [[ "$checkout_commit" == face07e405eb11f209f39e78f01704fac2dff6f7 ]]
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == env.TAG and .isDraft == false and .isPrerelease == true) | .tagName' \
            | grep -Fx "$TAG"
          printf 'desktop source: %s\n' "$checkout_commit"
      - name: Check out pinned Jcode runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: f11adb5996c541592e28519018709eebebc9fce4
          path: jcode
          submodules: recursive
      - name: Verify pinned Jcode runtime
        run: test "$(git -C jcode rev-parse HEAD)" = f11adb5996c541592e28519018709eebebc9fce4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            jcode-desktop
            jcode
          cache-on-failure: true
      - name: Install Linux build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dri \
            mesa-vulkan-drivers openbox wayland-utils weston x11-utils xvfb
      - name: Build and package Linux from tag
        env:
          VERSION: ${{ inputs.tag }}
          JCODE_REPO: ${{ github.workspace }}/jcode
        run: jcode-desktop/scripts/package-linux.sh
      - name: Verify Linux package
        run: |
          python3 jcode-desktop/scripts/verify-release-package.py jcode-desktop/dist/linux/*.tar.gz
          dpkg-deb --info jcode-desktop/dist/linux/*.deb
          dpkg-deb --contents jcode-desktop/dist/linux/*.deb | grep -E 'jcode-desktop|jcode-harness-api-bridge|jcode.desktop|jcode.png'
          (cd jcode-desktop/dist/linux && sha256sum -c SHA256SUMS-linux)
      # Preserve the expensive binaries even if a smoke fixture needs another
      # correction. Release upload remains gated on both launch smokes below.
      - name: Preserve packaged Linux artifacts before smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-recovery-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 7
          path: |
            jcode-desktop/dist/linux/Jcode-*.tar.gz
            jcode-desktop/dist/linux/Jcode-*.deb
            jcode-desktop/dist/linux/SHA256SUMS-linux
      - name: Smoke-test Linux package on X11
        shell: bash
        run: |
          set -euo pipefail
          app=$(find jcode-desktop/dist/linux -type f -name jcode-desktop | head -1)
          cli=$(dirname "$app")/jcode
          "$cli" --version
          smoke="$RUNNER_TEMP/jcode-linux-smoke/x11"
          runtime="$smoke/runtime"
          home="$smoke/home"
          mkdir -p "$runtime" "$home"
          chmod 700 "$runtime"
          timeout 25s xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -euo pipefail
            app=$1; runtime=$2; home=$3; smoke=$4
            openbox >"$smoke/openbox.log" 2>&1 &
            openbox_pid=$!
            trap '\''kill "$openbox_pid" 2>/dev/null || true'\'' EXIT
            for _ in {1..50}; do
              xprop -root _NET_SUPPORTING_WM_CHECK >/dev/null 2>&1 && break
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK >/dev/null
            env -u WAYLAND_DISPLAY XDG_RUNTIME_DIR="$runtime" HOME="$home" \
              LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=vulkan \
              "$app" >"$smoke/app.log" 2>&1 &
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              echo "X11 app exited before smoke completed (status ${status:-0})" >&2
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
          ' bash "$app" "$runtime" "$home" "$smoke"
      - name: Smoke-test Linux package on native Wayland
        shell: bash
        run: |
          set -euo pipefail
          app=$(find jcode-desktop/dist/linux -type f -name jcode-desktop | head -1)
          smoke="$RUNNER_TEMP/jcode-linux-smoke/wayland"
          runtime="$smoke/runtime"
          home="$smoke/home"
          mkdir -p "$runtime" "$home"
          chmod 700 "$runtime"
          # The headless backend has no wl_seat, which GPUI requires. Nest
          # Weston in Xvfb so it exposes a real virtual seat while the app still
          # connects through native Wayland with DISPLAY removed.
          timeout 30s xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -euo pipefail
            app=$1; runtime=$2; home=$3; smoke=$4
            openbox >"$smoke/openbox.log" 2>&1 &
            openbox_pid=$!
            XDG_RUNTIME_DIR="$runtime" LIBGL_ALWAYS_SOFTWARE=1 \
              weston --backend=x11-backend.so --use-pixman \
                --socket=jcode-ci-wayland --idle-time=0 >"$smoke/weston.log" 2>&1 &
            weston_pid=$!
            trap '\''kill "$weston_pid" "$openbox_pid" 2>/dev/null || true'\'' EXIT
            ready=0
            for _ in {1..100}; do
              if [[ -S "$runtime/jcode-ci-wayland" ]] && \
                 XDG_RUNTIME_DIR="$runtime" WAYLAND_DISPLAY=jcode-ci-wayland \
                   timeout 2s wayland-info >"$smoke/registry.log" 2>&1 && \
                 grep -q wl_seat "$smoke/registry.log"; then
                ready=1
                break
              fi
              kill -0 "$weston_pid" 2>/dev/null || break
              sleep 0.1
            done
            [[ "$ready" == 1 ]]
            env -u DISPLAY XDG_RUNTIME_DIR="$runtime" HOME="$home" \
              WAYLAND_DISPLAY=jcode-ci-wayland LIBGL_ALWAYS_SOFTWARE=1 \
              WGPU_BACKEND=vulkan "$app" >"$smoke/app.log" 2>&1 &
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              echo "Wayland app exited before smoke completed (status ${status:-0})" >&2
              exit 1
            fi
            kill "$pid"
            wait "$pid" || true
          ' bash "$app" "$runtime" "$home" "$smoke"
      - name: Print Linux smoke diagnostics
        if: always()
        shell: bash
        run: |
          shopt -s nullglob globstar
          for file in "$RUNNER_TEMP"/jcode-linux-smoke/**/*.log; do
            echo "===== $file ====="
            cat "$file"
          done
          for file in "$RUNNER_TEMP"/jcode-linux-smoke/*/home/.local/state/jcode-desktop/*.log; do
            echo "===== $file ====="
            cat "$file"
          done
      - name: Upload Linux smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-recovery-smoke-diagnostics-${{ inputs.tag }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          path: ${{ runner.temp }}/jcode-linux-smoke
      - name: Upload recovered Linux artifacts to existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == env.TAG and .isDraft == false and .isPrerelease == true) | .tagName' \
            | grep -Fx "$TAG"
          mapfile -d '' files < <(
            find jcode-desktop/dist/linux -maxdepth 1 -type f \
              \( -name 'Jcode-*.tar.gz' -o -name 'Jcode-*.deb' -o -name 'SHA256SUMS-linux' \) \
              -print0
          )
          [[ "${#files[@]}" == 3 ]]
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
