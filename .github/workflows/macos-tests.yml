name: macOS tests

# Runs the Desktop UI and GPUI drop tests on real macOS hardware. No signing,
# notarization, or release credentials are involved, so this works even when
# the Apple developer agreement blocks packaging.
on:
  workflow_dispatch:
    inputs:
      jcode_ref:
        description: "1jehuang/jcode ref providing the SDK path dependencies"
        default: master
      filter:
        description: "cargo test filter for the Desktop UI crate (empty = all)"
        default: ""
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/macos-tests.yml"

permissions:
  contents: read

concurrency:
  group: macos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: jcode-desktop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ inputs.jcode_ref || 'master' }}
          path: jcode
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            jcode-desktop
            jcode
          key: macos-tests
      - name: Build the Desktop host and UI
        working-directory: jcode-desktop
        run: |
          cargo build --bin jcode-desktop
          cargo build -p jcode-desktop-ui
      - name: Test the Desktop UI
        working-directory: jcode-desktop
        run: cargo test -p jcode-desktop-ui --lib -- ${{ inputs.filter }}
      - name: Test GPUI file drops and the macOS drop bridge
        run: |
          set -euo pipefail
          rev=$(grep -m1 -o 'rev = "[0-9a-f]*"' jcode-desktop/Cargo.toml | cut -d'"' -f2)
          git clone --quiet https://github.com/1jehuang/gpui gpui
          git -C gpui checkout --quiet "$rev"
          cd gpui
          cargo test -p gpui --lib --features test-support -- file_drop
          cargo check -p gpui_macos
