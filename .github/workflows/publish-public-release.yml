name: Publish public desktop downloads
run-name: Publish ${{ inputs.tag || github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [Linux and Windows desktop release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Complete private release to publish (desktop-vVERSION)
        required: true
        type: string

permissions:
  # Write is needed only to mirror the promoted feed to the legacy desktop-updates asset.
  contents: write
  actions: write

concurrency:
  group: desktop-public-distribution
  cancel-in-progress: false

jobs:
  publish:
    # GITHUB_TOKEN-created tags are explicitly workflow-dispatched by the
    # coordinator. Only tag-ref builds may auto-publish, never manual main builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'desktop-v') &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      # Always use reviewed main, never checkout a workflow_run's untrusted ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Full history and tags let release notes fall back to commit subjects.
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and publication tools
        run: |
          python3 -c 'import re,os; assert re.fullmatch(r"desktop-v\d+\.\d+\.\d+(?:-beta\.\d+)?", os.environ["RELEASE_TAG"]), "invalid desktop tag"'
          python3 -m unittest discover -s tests -v
      - name: Download private release assets without source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'Jcode-*.dmg' --pattern 'Jcode-*.zip' \
            --pattern 'Jcode-*.tar.gz' --pattern 'Jcode-*.deb' \
            --pattern 'SHA256SUMS*' --pattern appcast.xml
          python3 scripts/prepare-public-release.py artifacts "$RELEASE_TAG" --manifest artifacts/latest.json
      - name: Publish binaries and verify anonymous downloads before promotion
        env:
          GH_TOKEN: ${{ secrets.JCODE_PUBLIC_RELEASE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing public distribution token'; exit 1; }
          python3 scripts/publish-public-release.py artifacts "$RELEASE_TAG"
      - name: Verify the website download routes
        id: website_verification
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('artifacts/latest.json').read_text())
          # Test the same stable URLs visitors use, including all package bytes.
          for asset in manifest['assets']:
              digest = hashlib.sha256()
              size = 0
              request = urllib.request.Request(asset['browser_download_url'], headers={'User-Agent': 'JcodeReleaseVerifier/1.0'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
                      size += len(chunk)
              assert digest.hexdigest() == asset['sha256'], asset['name']
              assert size == asset['size'], asset['name']
              print('Website download verified:', asset['name'], size, flush=True)
          PY
      - name: Mirror the promoted public feed to the legacy update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 0.1.0-beta.10 to beta.23 read desktop-updates/appcast.xml. Mirror the
          # live public feed (never a prerelease that skipped promotion), and
          # only after every enclosure it references is anonymously downloadable.
          curl --fail --silent --show-error --location --retry 3 \
            https://jcode.sh/desktop/appcast.xml -o legacy-appcast.xml
          python3 - legacy-appcast.xml <<'PY'
          import sys, urllib.request, xml.etree.ElementTree as ET
          enclosures = ET.parse(sys.argv[1]).findall("./channel/item/enclosure")
          assert enclosures, "public appcast has no enclosures"
          for enclosure in enclosures:
              url = enclosure.get("url")
              request = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "JcodeReleaseVerifier/1.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert response.status == 200, url
              print("Legacy feed enclosure reachable:", url, flush=True)
          PY
          if ! gh release view desktop-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updates --repo "$GITHUB_REPOSITORY" \
              --target main --prerelease --title "Jcode Desktop update feed" \
              --notes "Machine-readable Sparkle update feed. Download the latest desktop release instead."
          fi
          cp legacy-appcast.xml appcast.xml
          gh release upload desktop-updates --repo "$GITHUB_REPOSITORY" --clobber appcast.xml
      - name: Trigger public macOS install and Gatekeeper acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run macos-public-release-verify.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
      - name: Trigger legacy macOS auto-update matrix against the new appcast
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run macos-update-matrix.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Dispatch verified public Desktop Discord announcement
        id: discord_dispatch
        if: ${{ !cancelled() && steps.website_verification.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discord-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
      - name: Warn when Discord dispatch failed
        if: ${{ !cancelled() && steps.discord_dispatch.outcome == 'failure' }}
        run: echo '::warning::Public Desktop release succeeded, but Discord dispatch failed. Rerun discord-release.yml manually after checking the public website.'
