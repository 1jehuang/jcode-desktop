name: Linux and Windows desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: jcode-desktop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: 7ece08496f0ad3c3cd51845d56dbfc57b8461e4d
          path: jcode
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            jcode-desktop
            jcode
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build and package Linux
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ github.ref_name }}
          JCODE_REPO: ${{ github.workspace }}/jcode
        run: jcode-desktop/scripts/package-linux.sh
      - name: Verify Linux package
        if: matrix.platform == 'linux'
        run: |
          python3 jcode-desktop/scripts/verify-release-package.py jcode-desktop/dist/linux/*.tar.gz
          dpkg-deb --info jcode-desktop/dist/linux/*.deb
          dpkg-deb --contents jcode-desktop/dist/linux/*.deb | grep -E 'jcode-desktop|jcode-harness-api-bridge|jcode.desktop|jcode.png'
      - name: Build and package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          JCODE_REPO: ${{ github.workspace }}/jcode
        run: ./jcode-desktop/scripts/package-windows.ps1
      - name: Verify Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python jcode-desktop/scripts/verify-release-package.py (Get-ChildItem jcode-desktop/dist/windows/*.zip).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          path: jcode-desktop/dist/${{ matrix.platform }}/Jcode-*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Wait for secure macOS workflow and upload to its prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..90}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -qx true; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
              exit 0
            fi
            echo "Waiting for notarized macOS workflow to create prerelease ($attempt/90)..."
            sleep 120
          done
          echo "macOS secure workflow did not create the prerelease" >&2
          exit 1
