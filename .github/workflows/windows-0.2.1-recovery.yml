name: Windows 0.2.1 native recovery

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-windows-recovery-0.2.1
  cancel-in-progress: false

env:
  RELEASE_TAG: desktop-v0.2.1
  DESKTOP_SHA: 4c5495f85a03671b20a00a108f10e6dbe041584d
  RUNTIME_SHA: 91c0bdda3884952bd2eba2e5cfc78fbed1281495

jobs:
  recover-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
            native-arch: X64
            target: x86_64-pc-windows-msvc
            checksums: SHA256SUMS-windows
          - os: windows-11-arm
            arch: aarch64
            native-arch: Arm64
            target: aarch64-pc-windows-msvc
            checksums: SHA256SUMS-windows-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Require unpublished stable draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '(.tagName == "desktop-v0.2.1" and .isDraft == true and .isPrerelease == false)' | grep -qx true
      - name: Check out immutable Desktop source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: desktop-v0.2.1
          fetch-depth: 0
          path: jcode-desktop
          persist-credentials: false
      - name: Check out pinned runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: 91c0bdda3884952bd2eba2e5cfc78fbed1281495
          path: jcode
          submodules: recursive
          persist-credentials: false
      - name: Check out reviewed transport tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Verify immutable sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C jcode-desktop rev-parse HEAD)" = "$DESKTOP_SHA"
          test "$(git -C jcode-desktop rev-parse "$RELEASE_TAG^{}")" = "$DESKTOP_SHA"
          test "$(git -C jcode rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git -C release-tools rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate release target and publication contracts
        run: python -m unittest discover -s jcode-desktop/tests -p test_release_targets.py -v
      - name: Require native Windows runner
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.native-arch }}') {
            throw 'Recovery requires the original native Windows runner architecture'
          }
      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'amd64_arm64' || 'amd64' }}
      - name: Test Windows transport after MSVC environment setup
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_TEST_BASH="$(cygpath -m "$(command -v bash)")"
          command -v jq
          python -m unittest discover -s release-tools/tests -p test_windows_0_2_1_recovery.py -v
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            jcode-desktop
            jcode
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Build and package Windows
        shell: pwsh
        env:
          SKIP_BUILD: "0"
          VERSION: ${{ env.RELEASE_TAG }}
          JCODE_REPO: ${{ github.workspace }}/jcode
          TARGET: ${{ matrix.target }}
        run: ./jcode-desktop/scripts/package-windows.ps1
      - name: Verify Windows package
        shell: pwsh
        run: |
          python jcode-desktop/scripts/verify-release-package.py (Get-ChildItem jcode-desktop/dist/windows/*.zip).FullName --target '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Windows package verification failed' }
          $stage = Get-ChildItem jcode-desktop/dist/windows -Directory -Filter 'Jcode-*-windows-${{ matrix.arch }}' | Select-Object -First 1
          & "$($stage.FullName)/jcode.exe" --version
          if ($LASTEXITCODE) { throw 'Bundled Jcode CLI did not start' }
      - name: Smoke-test Windows package
        shell: pwsh
        run: |
          $stage = Get-ChildItem jcode-desktop/dist/windows -Directory -Filter 'Jcode-*-windows-${{ matrix.arch }}' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'jcode-desktop-windows.log'
          $process = Start-Process -FilePath "$($stage.FullName)/jcode-desktop.exe" -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            throw "Jcode Desktop exited during launch with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id
          $process.WaitForExit()
      - name: Verify sources remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git -C jcode-desktop diff HEAD --exit-code
          git -C jcode diff HEAD --exit-code
      - name: Upload only native-verified missing Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_CHECKSUMS: ${{ matrix.checksums }}
        run: |
          set -euo pipefail
          require_draft() {
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq '(.tagName == "desktop-v0.2.1" and .isDraft == true and .isPrerelease == false)' | grep -qx true
          }
          require_source() {
            remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            remote_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)
            if [[ "$remote_type" == tag ]]; then
              remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_sha" --jq .object.sha)
            else
              test "$remote_type" = commit
            fi
            test "$remote_sha" = "$DESKTOP_SHA"
          }
          require_draft
          require_source
          case "$RELEASE_ARCH:$RELEASE_CHECKSUMS" in
            x86_64:SHA256SUMS-windows|aarch64:SHA256SUMS-windows-aarch64) ;;
            *) echo 'Unexpected Windows recovery target' >&2; exit 1 ;;
          esac
          files=("jcode-desktop/dist/windows/Jcode-0.2.1-windows-$RELEASE_ARCH.zip"
                 "jcode-desktop/dist/windows/$RELEASE_CHECKSUMS")
          for file in "${files[@]}"; do test -s "$file"; done
          # PowerShell emits CRLF. Normalize only the verification stream, never
          # the original manifest bytes uploaded and compared below.
          (cd jcode-desktop/dist/windows && sed 's/\r$//' "$RELEASE_CHECKSUMS" | sha256sum -c -)
          remote_dir=$(mktemp -d)
          trap 'rm -rf "$remote_dir"' EXIT
          # Existing assets must match byte-for-byte. Never clobber a prior upload.
          # Check both assets before any write so a partial prior upload is safe.
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=()
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq "$name" <<< "$existing"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir" --pattern "$name"
              cmp "$file" "$remote_dir/$name"
            else
              missing+=("$file")
            fi
          done
          require_draft
          require_source
          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${missing[@]}"
          fi
          # Redownload even pre-existing assets, then compare hashes and manifest.
          mkdir "$remote_dir/after"
          for file in "${files[@]}"; do
            name=$(basename "$file")
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir/after" --pattern "$name"
            test "$(sha256sum "$file" | cut -d ' ' -f 1)" = "$(sha256sum "$remote_dir/after/$name" | cut -d ' ' -f 1)"
          done
          (cd "$remote_dir/after" && sed 's/\r$//' "$RELEASE_CHECKSUMS" | sha256sum -c -)
          require_source
          require_draft
