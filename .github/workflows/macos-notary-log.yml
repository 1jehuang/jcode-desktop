name: macOS notarization log

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization submission UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  log:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Configure notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials jcode-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
      - name: Fetch notarization log
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: xcrun notarytool log "$SUBMISSION_ID" --keychain-profile jcode-notary
