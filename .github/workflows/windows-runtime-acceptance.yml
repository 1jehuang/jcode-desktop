name: Windows packaged runtime acceptance

# Explicit dispatch only. Never publishes or changes signing configuration.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Desktop tag to test when build_source is false
        default: desktop-v0.6.1
        required: true
      build_source:
        description: Build Desktop and both companions from source instead of downloading
        type: boolean
        default: false
      runtime_ref:
        description: Immutable Jcode runtime commit required for a source build
        default: ''
      artifact_run:
        description: Optional run ID of a prior source build, to retest its exact ZIP without rebuilding
        default: ''
      ui_integration:
        description: Also run native caption, window, single-instance and fixture rendering checks
        type: boolean
        default: true
      architecture:
        description: Native runner architectures
        type: choice
        options: [both, x86_64, aarch64]
        default: both

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize identical source/input tests, not distinct Desktop fixes.
  group: windows-runtime-acceptance-${{ github.sha }}-${{ inputs.build_source }}-${{ inputs.runtime_ref || inputs.artifact_run || inputs.release_tag }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          BUILD_SOURCE: ${{ inputs.build_source }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          python3 - <<'PY'
          import json, os, re
          if os.environ['BUILD_SOURCE'] == 'true' and not re.fullmatch('[0-9a-f]{40}', os.environ['RUNTIME_REF']):
              raise SystemExit('Source validation requires an immutable runtime SHA')
          if os.environ['ARTIFACT_RUN'] and (os.environ['BUILD_SOURCE'] == 'true' or not os.environ['ARTIFACT_RUN'].isdigit()):
              raise SystemExit('Artifact retesting requires a numeric run ID and build_source=false')
          runners = [dict(os='windows-2025', arch='x86_64', native='X64', target='x86_64-pc-windows-msvc'),
                     dict(os='windows-11-arm', arch='aarch64', native='Arm64', target='aarch64-pc-windows-msvc')]
          selected = [r for r in runners if os.environ['ARCHITECTURE'] in ('both', r['arch'])]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps(dict(include=selected)) + '\n')
          PY
  accept:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: jcode-desktop
          fetch-depth: 0
          persist-credentials: false
      - name: Require native Windows architecture
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne '${{ matrix.native }}') {
            throw 'Acceptance must run on the native package architecture'
          }
      - name: Check out exact runtime source
        if: inputs.build_source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ inputs.runtime_ref }}
          path: jcode
          submodules: recursive
          persist-credentials: false
      - name: Verify runtime source compatibility
        if: inputs.build_source
        env:
          RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: python jcode-desktop/scripts/verify-runtime-source.py --runtime jcode --expected-commit "$env:RUNTIME_REF"
      - name: Configure MSVC
        if: inputs.build_source
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'amd64_arm64' || 'amd64' }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.build_source
        with:
          targets: ${{ matrix.target }}
      - name: Disable POSIX rustc wrapper
        if: inputs.build_source
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_BUILD_RUSTC_WRAPPER='
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        if: inputs.build_source
        with:
          workspaces: |
            jcode-desktop
            jcode
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Install pinned justrust for native Windows checks
        if: inputs.build_source
        shell: bash
        run: bash jcode/scripts/install_justrust_ci.sh
      - name: Test native named-pipe transport
        if: inputs.build_source
        shell: pwsh
        env:
          # Windows named pipes require execution on this native runner, not Linux hosted.
          JUSTRUST_TOOLCHAIN: system
          JUSTRUST_DISABLE: '1' # alpha.17 Windows measurement allocation bug
          JUSTRUST_NO_TELEMETRY: '1'
          JUSTRUST_SLOTS: '0'
        run: |
          justrust check --local --locked --manifest-path jcode/Cargo.toml -p jcode-transport --target '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Native transport check failed' }
          justrust test --local --locked --manifest-path jcode/Cargo.toml -p jcode-transport --target '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Native transport regression tests failed' }
      - name: Test native Desktop single-instance handoff
        if: inputs.build_source
        shell: pwsh
        env:
          # These tests exercise real Win32 named pipes, not the Linux backend.
          JUSTRUST_TOOLCHAIN: system
          JUSTRUST_DISABLE: '1' # alpha.17 Windows measurement allocation bug
          JUSTRUST_NO_TELEMETRY: '1'
          JUSTRUST_SLOTS: '0'
        run: |
          # The pinned sibling runtime can change the Desktop path-dependency graph.
          # Match package-windows.ps1: resolve only required lockfile updates here.
          justrust test --local --release --manifest-path jcode-desktop/Cargo.toml -p jcode-desktop --bin jcode-desktop --target '${{ matrix.target }}' host::instance::platform::tests
          if ($LASTEXITCODE) { throw 'Native Desktop single-instance regression tests failed' }
      - name: Build the actual Windows package
        if: inputs.build_source
        shell: pwsh
        env:
          VERSION: 0.0.0-windows-acceptance
          JCODE_REPO: ${{ github.workspace }}/jcode
          TARGET: ${{ matrix.target }}
        run: ./jcode-desktop/scripts/package-windows.ps1
      - name: Download published Windows ZIP
        if: "!inputs.build_source && inputs.artifact_run == ''"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY -p '*windows-${{ matrix.arch }}.zip' -p 'SHA256SUMS-windows${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}' -D downloaded
          if ($LASTEXITCODE) { throw 'Release download failed' }
      - name: Download the exact previously built Windows ZIP
        if: inputs.artifact_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          gh run download $env:ARTIFACT_RUN --repo $env:GITHUB_REPOSITORY -n 'windows-runtime-package-${{ matrix.arch }}' -D downloaded
          if ($LASTEXITCODE) { throw 'Source package artifact download failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-runtime-evidence" | Out-Null
          gh run view $env:ARTIFACT_RUN --repo $env:GITHUB_REPOSITORY --json headSha,event,workflowName > "$env:RUNNER_TEMP/windows-runtime-evidence/source-run.json"
          if ($LASTEXITCODE) { throw 'Source package provenance lookup failed' }
      - name: Verify ZIP and extract under a path with spaces
        shell: pwsh
        env:
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          $archive = if ('${{ inputs.build_source }}' -eq 'true') {
            (Get-ChildItem jcode-desktop/dist/windows/*.zip).FullName
          } else { (Get-ChildItem downloaded/*.zip).FullName }
          python jcode-desktop/scripts/verify-release-package.py $archive --target '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Package structure or architecture verification failed' }
          if ('${{ inputs.build_source }}' -ne 'true' -and '${{ inputs.artifact_run }}' -eq '') {
            $line = Get-Content (Get-ChildItem downloaded/SHA256SUMS*).FullName | Where-Object { $_ -match [regex]::Escape((Split-Path $archive -Leaf)) }
            $expected = ($line -split '\s+')[0]
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Published ZIP checksum mismatch' }
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-runtime-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          [ordered]@{
            archive = (Split-Path $archive -Leaf)
            sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            acceptanceCommit = $env:GITHUB_SHA
            runtimeCommit = $env:RUNTIME_REF
            sourceArtifactRun = $env:ARTIFACT_RUN
            releaseTag = $env:RELEASE_TAG
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'package-provenance.json')
          $destination = Join-Path $env:RUNNER_TEMP 'Jcode package with spaces'
          Expand-Archive $archive -DestinationPath $destination
          $app = Get-ChildItem $destination -Recurse -Filter jcode-desktop.exe
          if (@($app).Count -ne 1) { throw 'Expected exactly one packaged Desktop' }
          "PACKAGE_DIR=$($app.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test cold start, real sessions, disconnects, recovery and warm relaunch
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python jcode-desktop/scripts/windows-ci-desktop.py --evidence "$env:RUNNER_TEMP/windows-runtime-evidence/runtime-desktop.json" -- python jcode-desktop/scripts/windows-runtime-acceptance.py "$env:PACKAGE_DIR" "$env:RUNNER_TEMP/windows-runtime-evidence"
          if ($LASTEXITCODE) { throw 'Native Windows package runtime acceptance failed' }
      - name: Verify native Windows UI integration and fixture rendering separately
        # Retain independent UI diagnostics when a runtime assertion fails.
        # The failed runtime step still fails the job and the release gate.
        if: always() && inputs.ui_integration && env.PACKAGE_DIR != ''
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          if ($LASTEXITCODE) { throw 'Screenshot dependency installation failed' }
          python jcode-desktop/scripts/windows-ci-desktop.py --evidence "$env:RUNNER_TEMP/windows-runtime-evidence/ui-desktop.json" -- python jcode-desktop/scripts/windows_screenshots.py "$env:PACKAGE_DIR/jcode-desktop.exe" "$env:RUNNER_TEMP/windows-runtime-evidence/ui-integration" --states caption,caption-light,windows-integration,chat,diff,applet --resolution 1920x1080
          if ($LASTEXITCODE) { throw 'Native Windows UI integration or fixture rendering failed' }
      - name: Preserve source-built ZIP for inspection, without publishing
        if: always() && inputs.build_source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-package-${{ matrix.arch }}
          path: jcode-desktop/dist/windows/*.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve real runtime diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-runtime-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
