name: Windows screenshots

# On demand only: never runs on push, PR, or schedule.
# Trigger with: gh workflow run windows-screenshots.yml [-f states=chat,diff]
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states, or 'all' (see scripts/windows_screenshots.py)"
        default: all
      jcode_ref:
        description: "1jehuang/jcode ref providing the SDK path dependencies"
        default: master
      resolution:
        description: "Runner display resolution"
        default: 1920x1080

permissions:
  contents: read

concurrency:
  group: windows-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: jcode-desktop
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 1jehuang/jcode
          ref: ${{ inputs.jcode_ref }}
          path: jcode
          submodules: recursive
          persist-credentials: false
      - name: Configure MSVC build environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      # .cargo/config.toml routes rustc through a POSIX shell wrapper that
      # native Windows cannot execute.
      - name: Disable POSIX rustc wrapper
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_BUILD_RUSTC_WRAPPER='
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: jcode-desktop
          cache-on-failure: true
          key: windows-screenshots
      - name: Build Jcode Desktop (dev profile)
        shell: pwsh
        run: |
          cargo build --manifest-path jcode-desktop/Cargo.toml --bin jcode-desktop
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
      - name: Capture screenshots
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python jcode-desktop/scripts/windows_screenshots.py `
            jcode-desktop/target/debug/jcode-desktop.exe screenshots `
            --states '${{ inputs.states }}' --resolution '${{ inputs.resolution }}'
          if ($LASTEXITCODE) { throw 'Some states failed to capture' }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14
