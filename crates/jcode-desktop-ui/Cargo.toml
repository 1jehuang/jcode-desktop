[package]
name = "jcode-desktop-ui"
version = "0.3.2"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpui.workspace = true
gpui-thinking-orbs = { git = "https://github.com/FrancoEscob/gpui-thinking-orbs", rev = "8bb92031040688bfd24e4d6bd96c76b61ed86ad1" }
gpui_platform.workspace = true
jcode-desktop-api.workspace = true
jcode-desktop-motion.workspace = true
jcode-sdk = { path = "../../../jcode/crates/jcode-sdk" }
jcode-provider-core = { path = "../../../jcode/crates/jcode-provider-core" }
jcode_core = { package = "jcode-core", path = "../../../jcode/crates/jcode-core" }
jcode-render-core = { path = "../../../jcode/crates/jcode-render-core" }
jcode-selfdev-types = { path = "../../../jcode/crates/jcode-selfdev-types" }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
anyhow = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
semver = "1"
tempfile = "3"
# The host's PTY dependencies enable extra_traits. Match that feature set even
# when an older host rebuilds only this package, preserving shared GPUI TypeIds.
libc = { version = "0.2", features = ["extra_traits"] }
arboard = "3"
async-channel = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer.git", rev = "3726ccbffe0e8032361eb9668694b24f77858060", default-features = false, features = ["scene"] }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
handterm-common = { git = "https://github.com/1jehuang/handterm", rev = "ead926b6f13a1f30d58836c4fd8fb325660bae96" }

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
jcode-base = { path = "../../../jcode/crates/jcode-base", features = ["voice-capture"] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
# Match the bundled CLI's ARM64 build. The desktop only uses foundation
# helpers, not in-process embedding inference or provider implementations.
jcode-base = { path = "../../../jcode/crates/jcode-base", default-features = false, features = ["voice-capture"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
async-io = "2.6"
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
gpui_platform = { workspace = true, features = ["x11", "font-kit"] }

[dev-dependencies]
tempfile = "3"
gpui = { workspace = true, features = ["test-support"] }
hdrhistogram = "7.6"
