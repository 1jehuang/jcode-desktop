[package]
name = "jcode-desktop-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
jcode-desktop-api.workspace = true
jcode-sdk = { path = "../../../jcode/crates/jcode-sdk" }
jcode_core = { package = "jcode-core", path = "../../../jcode/crates/jcode-core" }
jcode-base = { path = "../../../jcode/crates/jcode-base" }
anyhow = "1"
arboard = "3"
async-channel = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer.git", tag = "v0.3.1" }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
vt100 = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
