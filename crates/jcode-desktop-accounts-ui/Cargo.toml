[package]
name = "jcode-desktop-accounts-ui"
version = "0.5.1"
edition.workspace = true
license.workspace = true
description = "Jcode Desktop's login leaves: masked secret input, provider catalog ordering, connection health"

# Split out of jcode-desktop-ui so login edits recompile a small crate instead
# of the whole UI. Linked statically into the UI cdylib, so hot reload and the
# host/UI ABI are unchanged. Must not depend on jcode-desktop-ui.
[lib]
path = "src/lib.rs"

[dependencies]
gpui.workspace = true
jcode-desktop-harness.workspace = true
jcode-desktop-ui-core.workspace = true
jcode-sdk = { path = "../../../jcode/crates/jcode-sdk" }
serde_json = "1.0.151"
tempfile = "3"
