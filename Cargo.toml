[workspace]
members = [".", "crates/jcode-desktop-api", "crates/jcode-desktop-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "bc538def4545534201bbfcac4e95ac34ea6501b6" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "bc538def4545534201bbfcac4e95ac34ea6501b6" }
jcode-desktop-api = { path = "crates/jcode-desktop-api" }

[package]
name = "jcode-desktop"
version = "0.1.0"
edition.workspace = true
description = "Jcode Desktop: a spatial, niri-inspired canvas of Jcode sessions"
license.workspace = true

[dependencies]
anyhow = "1"
gpui.workspace = true
gpui_platform.workspace = true
jcode-desktop-api.workspace = true
jcode-desktop-ui = { path = "crates/jcode-desktop-ui" }
libloading = "0.8"
portable-pty = "0.9"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11", "font-kit"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
# GPUI, the Wayland event loop, text shaping, and the renderer account for most
# of the work in a running development build. Keeping dependencies completely
# unoptimized made an idle hot-reload host consume a large fraction of one CPU
# core. Dependencies change infrequently, so optimize them while leaving our
# own crates at opt-level 0 for fast edit/rebuild cycles and straightforward
# debugging.
opt-level = 2
