[package]
name = "jcode-desktop"
version = "0.1.0"
edition = "2024"
description = "Jcode Desktop: a spatial, niri-inspired canvas of Jcode sessions"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
jcode-sdk = { path = "../jcode/crates/jcode-sdk" }
jcode_core = { package = "jcode-core", path = "../jcode/crates/jcode-core" }
anyhow = "1"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
unicode-segmentation = "1"
serde_json = "1.0.151"
portable-pty = "0.9"
vt100 = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11", "font-kit"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[profile.dev]
# GPUI's layout, text shaping, and scene construction run on every animation
# frame. Completely unoptimized development builds miss frame deadlines even
# when the application code is otherwise idle, so keep our crate cheap to
# rebuild while still optimizing the interactive hot path.
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
# Dependencies change rarely and contain most of GPUI's render pipeline. This
# is the largest win for smooth local `cargo run` builds.
opt-level = 2
