<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#fff;color:#111;font:14px Inter,Arial,sans-serif}h1{font-size:24px;letter-spacing:-.7px;margin:0 0 8px}p{margin:0 0 16px}.muted{color:#666;font-size:12px}.controls{display:flex;align-items:center;gap:12px;margin:20px 0}input{accent-color:#111}.pair{border-top:1px solid #ddd;padding:20px 0}.label{font:10px Inter,Arial,sans-serif;color:#666;letter-spacing:1px;margin-bottom:6px}.you{font-family:var(--you);font-size:var(--size,17px);margin:14px 0 18px;padding-left:14px;border-left:2px solid #bbb}.ai{font-family:var(--ai);font-size:var(--size,17px);line-height:1.65}button{background:#fff;color:#111;border:1px solid #bbb;padding:7px 12px;cursor:pointer;font:12px Inter,Arial,sans-serif}button:hover{background:#eee}.title{display:flex;justify-content:space-between;align-items:center;gap:12px}.selected{border-left:3px solid #111;padding-left:14px}#choice{min-height:20px;margin:12px 0;font-size:13px}
</style></head><body>
<h1>Two voices. Different type.</h1><p class="muted">Live font samples inside your conversation. Choose a pairing, then tell Jcode its number. This does not change your settings.</p>
<div class="controls"><label for="size">Text size</label><input id="size" type="range" min="14" max="24" value="17"><span id="value">17 px</span><button id="reset">Reset</button></div>
<div id="choice" role="status">Try the slider, or choose a pairing below.</div><div id="pairs"></div>
<script>
const pairs=[['Clean + literary','Inter','Liberation Serif'],['Technical + clean','JetBrainsMono Nerd Font','Inter'],['Quiet contrast','Inter','Cantarell'],['Clean + technical','Inter','JetBrainsMono Nerd Font']];
const root=document.getElementById('pairs');
pairs.forEach(([name,you,ai],i)=>{const el=document.createElement('section');el.className='pair';el.style.setProperty('--you',`"${you}"`);el.style.setProperty('--ai',`"${ai}"`);el.innerHTML=`<div class="title"><strong>0${i+1} · ${name}</strong><button>Choose 0${i+1}</button></div><p class="muted">You: ${you} · AI: ${ai}</p><div class="you"><div class="label">YOU</div>Could my messages look different from the AI's?</div><div class="ai"><div class="label">JCODE</div>Yes. Different typefaces give each voice its own character. Compare how this sentence feels in a serif, a sans serif, and a monospace font.</div>`;el.querySelector('button').onclick=()=>{document.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));el.classList.add('selected');document.getElementById('choice').textContent=`Selected 0${i+1}: ${you} for you, ${ai} for AI. Tell Jcode “pairing ${i+1}”.`};root.appendChild(el)});
const slider=document.getElementById('size');slider.oninput=()=>{document.body.style.setProperty('--size',slider.value+'px');document.getElementById('value').textContent=slider.value+' px'};document.getElementById('reset').onclick=()=>{slider.value='17';slider.oninput()};
</script></body></html>
