# Keep local edit/build cycles fast. The wrapper uses sccache when it is
# installed and transparently falls back to rustc everywhere else.
[build]
rustc-wrapper = "scripts/rustc-wrapper"

# mold is substantially faster than the system linker for this large GPUI
# dependency graph. This setting is Linux-only, so macOS packaging is intact.
[target.x86_64-unknown-linux-gnu]
linker = "scripts/fast-linker"
