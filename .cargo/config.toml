# Developers with sccache can opt in with
# `RUSTC_WRAPPER=scripts/rustc-wrapper cargo build`. Keeping a POSIX wrapper in
# the repository-wide `[build]` table prevents Cargo from starting at all on
# native Windows.

# mold is substantially faster than the system linker for this large GPUI
# dependency graph. This setting is Linux-only, so macOS packaging is intact.
[target.x86_64-unknown-linux-gnu]
linker = "scripts/fast-linker"
